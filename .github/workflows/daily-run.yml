name: 每日自动选股并推送飞书

on:
  # 定时触发：周一至周五 UTC 12:15 = 北京时间 20:15
  schedule:
    - cron: '15 12 * * 1-5'
  # 手动触发
  workflow_dispatch:

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 恢复历史行情数据库缓存
        uses: actions/cache@v4
        with:
          path: data
          key: sequoia-db-${{ github.run_id }}
          restore-keys: |
            sequoia-db-

      - name: 首次初始化（无历史库时回填）
        run: |
          if [ ! -f data/sequoia_v2.db ]; then
            echo "未发现历史数据库，执行全量回填..."
            python main.py --backfill
          else
            echo "已存在历史数据库，跳过回填"
          fi

      - name: 执行选股并推送飞书
        run: python main.py
